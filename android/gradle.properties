# Memoria de Gradle
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Limitar trabajos simultáneos
org.gradle.workers.max=2

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Configuración administrada por Flutter
android.builtInKotlin=true
android.newDsl=false